services:
  traefik:
    image: traefik:v3.1
  php:
    depends_on:
      - traefik
  schedule:
    entrypoint: ''
    command: ["php", "/var/www/html/artisan", "schedule:work"]
  queue:
    entrypoint: ''
    command: ["php", "/var/www/html/artisan", "queue:work", "--tries=3"]
    healthcheck:
      disable: true
